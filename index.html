<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1d4a">
<title>Vedant Sri Computer Institute</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root { --navy:#0b1d4a; --blue:#1e3a8a; --blue2:#2563eb; --teal:#14b8a6; --amber:#f59e0b; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, system-ui, -apple-system, "Noto Sans Devanagari", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, #f8fbff 0%, #e9f0fb 50%, #f4f7fc 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  option { color: #111; }

  /* ---------- Animated background ---------- */
  .bg-scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(30,58,138,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(30,58,138,.07) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 22s linear infinite;
    -webkit-mask-image: linear-gradient(to bottom, #000 20%, transparent 90%);
    mask-image: linear-gradient(to bottom, #000 20%, transparent 90%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(70px); animation: drift 24s ease-in-out infinite; }
  .b1 { width: 340px; height: 340px; background: #93c5fd; opacity: .35; top: -90px; left: -110px; }
  .b2 { width: 300px; height: 300px; background: #fcd34d; opacity: .22; bottom: -80px; right: -90px; animation-duration: 30s; }
  .float { position: absolute; bottom: -100px; opacity: .2; animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; }
  .float svg { width: 100%; height: auto; display: block; }

  /* ---------- Header ---------- */
  header {
    position: sticky; top: 0; z-index: 5;
    background: linear-gradient(90deg, var(--navy), var(--blue) 60%, #1d4ed8);
    color: #fff;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    box-shadow: 0 6px 20px -8px rgba(11,29,74,.5);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdrRight { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .langSel { width: auto; margin: 0; padding: 6px 10px; font-size: 13px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.35); }
  #logoutBtn { background: rgba(255,255,255,.16); box-shadow: none; width: auto; margin: 0; padding: 7px 12px; font-size: 13px; }
  .logoImg { height: 38px; width: auto; border-radius: 8px; background: #fff; padding: 2px; }
  .logoFallback {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #fbbf24, #f59e0b); color: var(--navy);
    font-weight: 800; font-size: 14px; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(255,255,255,.25);
  }

  /* ---------- Layout ---------- */
  main { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 18px 14px 6px; }
  .loginWrap { max-width: 440px; margin: 0 auto; }
  .foot { position: relative; z-index: 1; text-align: center; color: var(--muted); font-size: 12px; padding: 14px 12px 24px; }

  /* ---------- Hero (login) ---------- */
  .hero { text-align: center; padding: 4px 0 6px; }
  .deskScene { width: 100%; max-width: 330px; height: auto; display: block; margin: 0 auto; }
  .heroTitle { font-size: 19px; color: var(--navy); margin: 2px 0 4px; font-weight: 700; }
  .heroSub { font-size: 13px; color: var(--muted); margin: 0 0 14px; line-height: 1.5; }

  /* ---------- Cards ---------- */
  .card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,.96);
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 16px; padding: 18px; margin-bottom: 16px;
    box-shadow: 0 14px 34px -16px rgba(11,29,74,.28);
    animation: cardIn .45s ease both;
  }
  .card h3 { margin: 0 0 12px; font-size: 16px; color: var(--navy); display: flex; align-items: center; gap: 8px; }
  .card h3::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: linear-gradient(var(--amber), var(--blue2)); flex-shrink: 0; }
  #loginBrand { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 14px; }
  #loginBrand .logoImg { height: 80px; }
  #loginBrand .logoFallback { width: 80px; height: 80px; font-size: 26px; }
  .loginName { font-weight: 700; color: var(--navy); font-size: 17px; text-align: center; }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; }
  .tabs button { width: auto; margin: 0; white-space: nowrap; background: #fff; color: var(--blue); border: 1px solid var(--line); box-shadow: none; }
  .tabs button.active { background: linear-gradient(135deg, #fbbf24, var(--amber)); color: #1f2937; border-color: transparent; box-shadow: 0 6px 14px -8px rgba(245,158,11,.9); }

  /* ---------- Forms & buttons ---------- */
  input, select {
    width: 100%; padding: 12px; margin: 5px 0;
    border: 1.5px solid #d6dce8; border-radius: 10px;
    font-size: 15px; background: #fff; color: var(--ink);
    transition: border-color .2s, box-shadow .2s;
  }
  input:focus, select:focus { outline: none; border-color: var(--blue2); box-shadow: 0 0 0 4px rgba(37,99,235,.14); }
  label.muted { display: block; margin-top: 10px; font-size: 12.5px; font-weight: 600; color: #4b5563; }
  button {
    width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 12px;
    background: linear-gradient(135deg, var(--blue), var(--blue2)); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
    box-shadow: 0 8px 18px -8px rgba(37,99,235,.75);
    transition: transform .15s ease, box-shadow .2s ease;
  }
  button:hover { box-shadow: 0 10px 22px -8px rgba(37,99,235,.85); }
  button:active { transform: scale(.98); }
  button.secondary { background: #eef2f7; color: var(--ink); box-shadow: none; }
  button.small { width: auto; padding: 8px 12px; margin: 0; font-size: 13px; border-radius: 9px; box-shadow: none; }

  /* ---------- Rows & misc ---------- */
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed #e5e7eb; font-size: 14px; }
  .btns { display: flex; gap: 6px; flex-shrink: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  .error { color: #b91c1c; font-size: 14px; min-height: 18px; }
  .okTxt { color: #15803d; font-weight: 600; }
  .badTxt { color: #b91c1c; font-weight: 600; }
  .thumb { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: #e5e7eb; }
  .thumbFallback { display: inline-flex; align-items: center; justify-content: center; background: #dbe2f0; color: var(--blue); font-weight: 700; }
  .prev { display: block; height: 70px; width: auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 4px; margin: 6px 0; }
  .bigPhoto { width: 90px; height: 90px; border-radius: 12px; object-fit: cover; display: block; margin-bottom: 10px; }
  .hidden { display: none !important; }

  /* ---------- SVG animations ---------- */
  .code { transform-box: fill-box; transform-origin: left center; animation: typeIn 4s ease-in-out infinite; }
  .cursor { animation: blink 1s steps(1) infinite; }
  .led { animation: led 1.6s steps(2) infinite; }
  .bar { transform-box: fill-box; transform-origin: center bottom; animation: grow 2.8s ease-in-out infinite; }
  .floatY { animation: floatY 4.5s ease-in-out infinite; }
  .floatY2 { animation: floatY 5.5s ease-in-out infinite reverse; }
  .bob { animation: bob 3s ease-in-out infinite; }
  .steam { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 4 8; animation: steam 2.8s linear infinite; }
  .litkey { animation: keySlide 3.2s ease-in-out infinite; }
  .glow { transform-box: fill-box; transform-origin: center; animation: glowPulse 5s ease-in-out infinite; }

  @keyframes gridMove { to { background-position: 40px 40px; } }
  @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(22px,-16px); } }
  @keyframes rise { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-115vh) rotate(18deg); } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes typeIn { 0%,100% { transform: scaleX(.15); opacity: .5; } 45%,75% { transform: scaleX(1); opacity: 1; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes led { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes grow { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  @keyframes steam { from { stroke-dashoffset: 0; opacity: .9; } to { stroke-dashoffset: -28; opacity: 0; } }
  @keyframes keySlide { 0% { transform: translateX(0); } 50% { transform: translateX(124px); } 100% { transform: translateX(0); } }
  @keyframes glowPulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

function feeTotal(student, cfee) {
  if (!cfee) return 0;
  return student.feePlan === "monthly"
    ? (cfee.monthlyFee || 0) * (cfee.months || 0)
    : (cfee.oneTimeFee || 0);
}

function friendlyError(err) {
  if (err.code && /invalid-credential|wrong-password|user-not-found|invalid-email/.test(err.code)) {

// Image ko chhota karke data URL banata hai (Firestore doc ka size chhota rahe)
function resizeImage(file, maxW, mime) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      const ctx = c.getContext("2d");
      if (mime === "image/jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      resolve({ data: c.toDataURL(mime, 0.85), ratio: c.width / c.height });
    };
    img.onerror = () => reject(new Error("Image read nahi ho payi"));
    img.src = URL.createObjectURL(file);
  });
}

// ---------- Role check: admin hai ya student? ----------
async function isAdmin(uid) {
  return (await getDoc(doc(db, "admins", uid))).exists();
}
async function findStudentByUid(uid) {
  const snap = await getDocs(query(collection(db, "students"), where("authUid", "==", uid)));
  return snap.empty ? null : { id: snap.docs[0].id, ...snap.docs[0].data() };
}

onAuthStateChanged(auth, async (user) => {
  if (!user) { currentRole = null; showView("loginView"); return; }
  try {
    if (await isAdmin(user.uid)) {
      currentRole = "admin";
      showView("adminView");
      openAdminTab("dashboard");
      return;
    }
    const student = await findStudentByUid(user.uid);
    if (student) {
      currentRole = "student";
      await renderStudent(student);
      showView("studentView");
      return;
    }
    await signOut(auth);
    setLoginError(t("noAccess"));
    showView("loginView");
  } catch (err) {
    setLoginError("Error: " + err.message);
    showView("loginView");
  }
});

// ---------- Data loaders ----------
async function loadBatches() {
  const snap = await getDocs(collection(db, "batches"));
  return snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.name.localeCompare(b.name));
}
async function loadStudents() {
  const snap = await getDocs(collection(db, "students"));
  return snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => a.rollNo.localeCompare(b.rollNo));
}
async function loadTests() {
  const snap = await getDocs(collection(db, "tests"));
  return snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
}
async function loadCourseFees() {
  const snap = await getDocs(collection(db, "courseFees"));
  return Object.fromEntries(snap.docs.map((d) => [d.id, d.data()]));
}
async function loadPayments() {
  const snap = await getDocs(collection(db, "payments"));
  return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
}

async function loadPhotos() {
  const snap = await getDocs(collection(db, "photos"));
  return Object.fromEntries(snap.docs.map((d) => [d.id, d.data().photo]));
}

// ---------- Admin tabs ----------
async function openAdminTab(tab) {
  currentTab = tab;
  document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  const box = $("adminContent");
  box.innerHTML = `<p class="muted">Loading...</p>`;
  try {
    if (tab === "dashboard") {
      box.innerHTML = await renderDashboard();
    } else if (tab === "batches") {
      box.innerHTML = await renderBatches();
      bindBatches();
    } else if (tab === "students") {
      box.innerHTML = await renderStudentsTab();
      bindStudentsTab();
    } else if (tab === "tests") {
      box.innerHTML = await renderTests();
      bindTests();
    } else if (tab === "fees") {
      box.innerHTML = await renderFeesTab();
      bindFees();
    } else if (tab === "settings") {
      box.innerHTML = renderSettingsTab();
      bindSettings();
    }
  } catch (err) {
    box.innerHTML = `<p class="error">${esc(err.message)}</p>`;
  }
}

// Dashboard
async function renderDashboard() {
  const [batches, students, tests] = await Promise.all([loadBatches(), loadStudents(), loadTests()]);
  const rows = batches.map((b) => {
    const count = students.filter((s) => s.batchId === b.id).length;
    return `<div class="row"><span>${esc(b.name)} <span class="muted">(${esc(b.course)})</span></span><b>${count}</b></div>`;
  }).join("") || `<p class="muted">${t("noBatch")}</p>`;
  return `
    <div class="card">
      <div class="row"><span>${t("totalBatches")}</span><b>${batches.length}</b></div>
      <div class="row"><span>${t("totalStudents")}</span><b>${students.length}</b></div>
      <div class="row"><span>${t("totalTests")}</span><b>${tests.length}</b></div>
    </div>
    <div class="card"><h3>${t("batchWise")}</h3>${rows}</div>`;
}

// ---------- Batches ----------

  const batches = await loadBatches();
  const list = batches.map((b) => `
    <div class="row">
      <span><b>${esc(b.name)}</b><br><span class="muted">${esc(b.course)}</span></span>
      <span class="btns"><button class="small secondary" data-del-batch="${esc(b.id)}">${t("delete")}</button></span>
    </div>`).join("") || `<p class="muted">${t("noBatch")}</p>`;
  return `
    <div class="card">
      <h3>${t("newBatch")}</h3>
      <form id="batchForm">
        <input id="bName" placeholder="${t("batchName")}" required>
        <input id="bCourse" placeholder="${t("batchCourse")}" required>
        <button type="submit">${t("saveBatch")}</button>
      </form>
    </div>
    <div class="card"><h3>${t("batches")} (${batches.length})</h3>${list}</div>`;
}

async function refreshStudentList() {

async function saveStudent(e, editing) {
  e.preventDefault();
  const batchId = $("sBatch").value;
  const batch = (await getDoc(doc(db, "batches", batchId))).data();
  const fields = {
    name: $("sName").value.trim(),
    father: $("sFather").value.trim(),
    mother: $("sMother").value.trim(),
    address: $("sAddress").value.trim(),
    phone: $("sPhone").value.trim(),
    batchId,
    batchName: batch.name,
    course: batch.course,
    feePlan: $("sPlan").value
  };

  if (editing) {
    await setDoc(doc(db, "students", editing.rollNo), fields, { merge: true });
    await savePhoto(editing.rollNo, editing.authUid);
    alert(t("studentUpdated"));
    openAdminTab("students");
    return;
  }

  const rollNo = $("sRoll").value.trim().toUpperCase();
  if (!/^[A-Z0-9]+$/.test(rollNo)) return alert(t("rollInvalid"));
  const studentRef = doc(db, "students", rollNo);
  if ((await getDoc(studentRef)).exists()) return alert(t("rollExists"));

  let cred;
  try {
    cred = await createUserWithEmailAndPassword(secondaryAuth, studentEmail(rollNo), dobToPassword($("sDob").value));
  } catch (err) {
    if (err.code === "auth/email-already-in-use") return alert(t("rollReused"));
    throw err;
  }
  await signOut(secondaryAuth);

  await setDoc(studentRef, {
    ...fields,
    rollNo,
    dob: $("sDob").value,
    authUid: cred.user.uid,
    createdAt: serverTimestamp()
  });
  await savePhoto(rollNo, cred.user.uid);
  alert(t("studentSaved"));
  openAdminTab("students");
}

async function savePhoto(roll, authUid) {
  const file = $("sPhoto").files[0];
  if (!file) return;
  const r = await resizeImage(file, 160, "image/jpeg");
  await setDoc(doc(db, "photos", roll), { photo: r.data, authUid });
}

async function deleteStudent(roll) {
  if (!confirm(t("confirmDeleteStudent"))) return;
  const [marks, pays] = await Promise.all([
    getDocs(query(collection(db, "marks"), where("rollNo", "==", roll))),
    getDocs(query(collection(db, "payments"), where("rollNo", "==", roll)))
  ]);
  await Promise.all([
    ...marks.docs.map((d) => deleteDoc(d.ref)),
    ...pays.docs.map((d) => deleteDoc(d.ref)),
    deleteDoc(doc(db, "students", roll)),
    deleteDoc(doc(db, "photos", roll))
  ]);
  alert(t("studentDeleted"));
  openAdminTab("students");
}

async function openMarks(testId) {

  const [students, marksSnap] = await Promise.all([

  ]);
  const existing = Object.fromEntries(marksSnap.docs.map((d) => [d.data().rollNo, d.data().marks]));
  const batchStudents = students.filter((s) => s.batchId === test.batchId);

  const rows = batchStudents.map((s) => `
    <div class="row">
      <span><b>${esc(s.rollNo)}</b> - ${esc(s.name)}</span>
      <input class="mk" type="number" min="0" max="${test.maxMarks}" step="1"
        data-roll="${esc(s.rollNo)}" data-uid="${esc(s.authUid)}"
        value="${existing[s.rollNo] ?? ""}" style="width:90px;margin:0">
    </div>`).join("");

  const passInfo = test.passMarks != null ? ` | ${t("passMarks")}: ${test.passMarks}` : "";
  box.innerHTML = `
    <div class="card">
      <button id="backTests" class="small secondary">${t("back")}</button>
      <h3 style="margin-top:12px">${esc(test.title)}</h3>
      <p class="muted">${esc(test.batchName)} | ${fmtDate(test.date)} | ${t("maxMarks")}: ${test.maxMarks}${passInfo}</p>
      ${rows || `<p class="muted">${t("noStudentsInBatch")}</p>`}
      ${batchStudents.length ? `<button id="saveMarks">${t("saveMarks")}</button>` : ""}
      <p id="marksMsg" class="muted">${t("clearHint")}</p>
    </div>`;

  $("backTests").onclick = () => openAdminTab("tests");
  if (batchStudents.length) $("saveMarks").onclick = safe(() => saveMarks(test, testId));
}

async function saveMarks(test, testId) {
  const inputs = [...document.querySelectorAll(".mk")];
  const jobs = [];
  for (const inp of inputs) {
    const roll = inp.dataset.roll;
    const ref = doc(db, "marks", `${testId}_${roll}`);
    const raw = inp.value.trim();
    if (raw === "") {
      jobs.push(deleteDoc(ref));
      continue;
    }
    const m = Number(raw);
    if (!Number.isInteger(m) || m < 0 || m > test.maxMarks) {
      return alert(`${roll}: ${t("marksRange")} ${test.maxMarks}`);
    }
    jobs.push(setDoc(ref, {
      testId,
      rollNo: roll,
      authUid: inp.dataset.uid,
      batchId: test.batchId,
      marks: m,
      updatedAt: serverTimestamp()
    }));
  }
  await Promise.all(jobs);
  $("marksMsg").textContent = t("marksSaved");
}

  $("backFees").onclick = () => openAdminTab("fees");

async function renderStudent(s) {
  currentStudent = s;
  const [testsSnap, marksSnap, paySnap, feeSnap, photoSnap] = await Promise.all([
    getDocs(collection(db, "tests")),
    getDocs(query(collection(db, "marks"), where("authUid", "==", s.authUid))),
    getDocs(query(collection(db, "payments"), where("authUid", "==", s.authUid))),
    getDoc(doc(db, "courseFees", s.course)),
    getDocs(query(collection(db, "photos"), where("authUid", "==", s.authUid)))
  ]);

  const tests = testsSnap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .filter((x) => x.batchId === s.batchId)
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const marks = Object.fromEntries(marksSnap.docs.map((d) => [d.data().testId, d.data().marks]));
  studentCache = { tests: Object.fromEntries(tests.map((x) => [x.id, x])), marks };

  const weekly = tests.filter((x) => x.type !== "annual");
  const annual = tests.filter((x) => x.type === "annual");
  const scored = weekly.filter((x) => marks[x.id] !== undefined);
  const avg = scored.length
    ? (scored.reduce((sum, x) => sum + marks[x.id], 0) / scored.length).toFixed(1)
    : null;

  const resultRow = (x) => {
    const m = marks[x.id];
    let status = `<span class="muted">${t("notYet")}</span>`;
    let action = "";
    if (m !== undefined) {
      status = `<b>${m} / ${x.maxMarks}</b>`;
      if (x.type === "annual" && x.passMarks != null) {
        const passed = m >= x.passMarks;
        status += ` <span class="${passed ? "okTxt" : "badTxt"}">${t(passed ? "pass" : "fail")}</span>`;
        if (passed) {
          action = `<div style="margin-top:6px"><button class="small" data-cert="${esc(x.id)}">${t("downloadCert")}</button></div>`;
        }
      }
    }
    return `<div class="row">
      <span>${esc(x.title)}<br><span class="muted">${fmtDate(x.date)}</span></span>
      <span style="text-align:right">${status}${action}</span>
    </div>`;
  };

  const cfee = feeSnap.exists() ? feeSnap.data() : null;
  const total = feeTotal(s, cfee);
  const pays = paySnap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const paid = sumPaid(pays);
  const feeHtml = total
    ? `
      <div class="row"><span class="muted">${t("feePlan")}</span><b>${t(s.feePlan === "monthly" ? "monthly" : "oneTime")}</b></div>
      <div class="row"><span class="muted">${t("totalDue")}</span><b>${money(total)}</b></div>
      <div class="row"><span class="muted">${t("paid")}</span><b>${money(paid)}</b></div>
      <div class="row"><span class="muted">${t("balance")}</span><b>${money(total - paid)}</b></div>
      ${s.feePlan === "monthly" && cfee && cfee.monthlyFee
        ? `<div class="row"><span class="muted">${t("installments")}</span><b>${Math.floor(paid / cfee.monthlyFee)} ${t("ofWord")} ${cfee.months || 0}</b></div>`
        : ""}
      <h3 style="margin:14px 0 6px;font-size:14px">${t("paymentHistory")}</h3>
      ${pays.map((p) => `<div class="row"><span>${fmtDate(p.date)} | ${t(p.mode)}</span><b>${money(p.amount)}</b></div>`).join("")
        || `<p class="muted">${t("noPayments")}</p>`}`
    : `<p class="muted">${t("feeNotSetStudent")}</p>`;

  const details = [
    [t("rollNo"), s.rollNo], [t("course"), s.course], [t("batch"), s.batchName],
    [t("father"), s.father], [t("mother"), s.mother], [t("dob"), fmtDate(s.dob)],
    [t("phone"), s.phone], [t("address"), s.address]
  ].map(([k, v]) => `<div class="row"><span class="muted">${k}</span><b>${esc(v)}</b></div>`).join("");

  $("studentView").innerHTML = `
    <div class="card">${photoSnap.empty ? "" : `<img class="bigPhoto" src="${photoSnap.docs[0].data().photo}" alt="">`}<h3>${esc(s.name)}</h3>${details}</div>
    <div class="card"><h3>${t("feeStatus")}</h3>${feeHtml}</div>
    <div class="card">
      <h3>${t("weeklyResults")}</h3>
      ${weekly.map(resultRow).join("") || `<p class="muted">${t("noResults")}</p>`}
      ${avg !== null ? `<div class="row"><span class="muted">${t("average")}</span><b>${avg} / ${MAX_WEEKLY}</b></div>` : ""}
    </div>
    <div class="card">
      <h3>${t("annualResults")}</h3>
      ${annual.map(resultRow).join("") || `<p class="muted">${t("noResults")}</p>`}
    </div>`;

  document.querySelectorAll("#studentView [data-cert]").forEach((b) =>
    (b.onclick = safe(() => downloadCertificate(b.dataset.cert))));
}

// Certificate PDF browser mein banta hai (English naam hona chahiye)
function downloadCertificate(testId) {
  const s = currentStudent;
  const test = studentCache.tests[testId];
  const m = studentCache.marks[testId];
  if (!test || m === undefined) return alert(t("noResults"));

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  const W = 297, H = 210, navy = [30, 58, 138];
  const center = { align: "center" };

  pdf.setDrawColor(...navy);
  pdf.setLineWidth(1.5);
  pdf.rect(8, 8, W - 16, H - 16);
  pdf.setLineWidth(0.4);
  pdf.rect(11, 11, W - 22, H - 22);

  if (settings.logoData) {
    const lw = Math.min(60, 24 * (settings.logoRatio || 1));
    pdf.addImage(settings.logoData, imgFmt(settings.logoData), W / 2 - lw / 2, 14, lw, 24);
  }

  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(22);
  pdf.setTextColor(...navy);
  pdf.text(settings.name || "Vedant Sri Computer Institute", W / 2, 50, center);
  if (settings.address) {
    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(11);
    pdf.setTextColor(60, 60, 60);
    pdf.text(settings.address, W / 2, 57, center);
  }

  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(26);
  pdf.setTextColor(...navy);
  pdf.text("CERTIFICATE", W / 2, 76, center);

  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(13);
  pdf.setTextColor(0, 0, 0);
  pdf.text("This is to certify that", W / 2, 90, center);

  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(22);
  pdf.text(s.name, W / 2, 104, center);

  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(12);
  pdf.text(`Father's name: ${s.father || "-"}   |   Roll No: ${s.rollNo}   |   Course: ${s.course}`, W / 2, 115, center);
  pdf.text(`has successfully passed the ${test.title} held on ${fmtDate(test.date)}`, W / 2, 127, center);
  pdf.text(`with ${m} out of ${test.maxMarks} marks.`, W / 2, 135, center);

  const certNo = `VSC-${(test.date || "").slice(0, 4)}-${s.rollNo}-${testId.slice(-4).toUpperCase()}`;
  pdf.setFontSize(10);
  pdf.setTextColor(80, 80, 80);
  pdf.text(`Certificate No: ${certNo}`, 22, H - 24);
  pdf.text(`Exam date: ${fmtDate(test.date)}`, 22, H - 18);

  if (settings.signatureData) {
    const sw = Math.min(50, 18 * (settings.signRatio || 2));
    pdf.addImage(settings.signatureData, imgFmt(settings.signatureData), W - 22 - sw, H - 50, sw, 18);
  }
  pdf.setDrawColor(0, 0, 0);
  pdf.line(W - 80, H - 30, W - 22, H - 30);
  pdf.setTextColor(0, 0, 0);
  pdf.setFontSize(11);
  pdf.text(settings.directorName || "Director", W - 51, H - 24, center);
  pdf.text("Director", W - 51, H - 18, center);

  pdf.save(`Certificate_${s.rollNo}.pdf`);
}

  applyI18n();
  renderBrand();
  if (currentRole === "admin") openAdminTab(currentTab);
  else if (currentRole === "student" && currentStudent) renderStudent(currentStudent).catch(console.error);
}

$("langSel").onchange = () => {
  LANG = $("langSel").value;
  localStorage.setItem("vsc_lang", LANG);
  rerender();

applyI18n();
loadSettings();
