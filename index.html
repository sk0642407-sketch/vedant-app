<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b1d4a">
<title>Vedant Sri Computer Institute</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, system-ui, -apple-system, "Noto Sans Devanagari", sans-serif;
    color: #f1f5f9;
    background:
      radial-gradient(1100px 650px at 8% -8%, #4338ca 0%, transparent 60%),
      radial-gradient(900px 600px at 108% 18%, #0e7490 0%, transparent 55%),
      linear-gradient(160deg, #0b1025 0%, #13103a 45%, #0a2540 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  option { color: #111; background: #fff; }

  /* ---------- Animated background (glass ke peeche ki roshni) ---------- */
  .bg-scene { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bg-scene::before, .bg-scene::after { content: ""; position: absolute; border-radius: 50%; filter: blur(90px); }
  .bg-scene::before { width: 460px; height: 460px; background: #f472b6; opacity: .28; bottom: -160px; left: 22%; animation: drift 30s ease-in-out infinite; }
  .bg-scene::after { width: 380px; height: 380px; background: #22d3ee; opacity: .22; top: 30%; right: -140px; animation: drift 26s ease-in-out infinite reverse; }
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.07) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 22s linear infinite;
    -webkit-mask-image: linear-gradient(to bottom, #000 20%, transparent 90%);
    mask-image: linear-gradient(to bottom, #000 20%, transparent 90%);
  }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); animation: drift 24s ease-in-out infinite; }
  .b1 { width: 340px; height: 340px; background: #6366f1; opacity: .35; top: -100px; left: -110px; }
  .b2 { width: 300px; height: 300px; background: #14b8a6; opacity: .25; bottom: -90px; right: -90px; animation-duration: 30s; }
  .float { position: absolute; bottom: -100px; color: rgba(255,255,255,.9) !important; opacity: .13; animation-name: rise; animation-timing-function: linear; animation-iteration-count: infinite; }
  .float svg { width: 100%; height: auto; display: block; }

  /* ---------- Glass header ---------- */
  header {
    position: sticky; top: 0; z-index: 5;
    color: #fff;
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: rgba(15, 23, 42, .35);
    backdrop-filter: blur(18px) saturate(170%);
    -webkit-backdrop-filter: blur(18px) saturate(170%);
    border-bottom: 1px solid rgba(255,255,255,.18);
    box-shadow: 0 8px 30px rgba(2,6,23,.35);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand h1 { font-size: 16px; margin: 0; font-weight: 700; letter-spacing: .2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdrRight { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  .langSel { width: auto; margin: 0; padding: 6px 12px; font-size: 13px; border-radius: 999px; background: rgba(255,255,255,.16); color: #fff; border: 1px solid rgba(255,255,255,.32); }
  #logoutBtn { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3); box-shadow: none; width: auto; margin: 0; padding: 7px 12px; font-size: 13px; text-shadow: none; }
  .logoImg { height: 38px; width: auto; border-radius: 10px; background: rgba(255,255,255,.92); padding: 3px; box-shadow: 0 4px 14px rgba(2,6,23,.3); }
  .logoFallback {
    display: inline-flex; align-items: center; justify-content: center;
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, #22d3ee, #f472b6); color: #0f172a;
    font-weight: 800; font-size: 14px; flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(255,255,255,.2), 0 6px 16px rgba(2,6,23,.3);
  }

  /* ---------- Layout ---------- */
  main { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; padding: 18px 14px 6px; }
  .loginWrap { max-width: 440px; margin: 0 auto; }
  .foot { position: relative; z-index: 1; text-align: center; color: rgba(226,232,240,.6); font-size: 12px; padding: 14px 12px 24px; }

  /* ---------- Glass panels (cards + hero) ---------- */
  .card, .hero {
    position: relative; z-index: 1;
    background: linear-gradient(135deg, rgba(255,255,255,.2), rgba(255,255,255,.05));
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid rgba(255,255,255,.26);
    border-top-color: rgba(255,255,255,.5);
    border-left-color: rgba(255,255,255,.4);
    border-radius: 22px;
    box-shadow: 0 12px 40px rgba(2,6,23,.38), inset 0 1px 0 rgba(255,255,255,.3);
  }
  .card { padding: 18px; margin-bottom: 16px; animation: cardIn .45s ease both; }

  /* ---------- Hero (login) ---------- */
  .hero { text-align: center; padding: 14px 12px 16px; margin-bottom: 16px; }
  .deskScene { width: 100%; max-width: 330px; height: auto; display: block; margin: 0 auto; }
  .heroTitle { font-size: 19px; color: #fff; margin: 4px 0 4px; font-weight: 800; text-shadow: 0 2px 14px rgba(0,0,0,.3); }
  .heroSub { font-size: 13px; color: rgba(226,232,240,.82); margin: 0 0 4px; line-height: 1.5; }

  .card h3 { margin: 0 0 12px; font-size: 16px; color: #fff; display: flex; align-items: center; gap: 8px; font-weight: 700; }
  .card h3::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: linear-gradient(#fbbf24, #22d3ee); flex-shrink: 0; }
  #loginBrand { display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 14px; }
  #loginBrand .logoImg { height: 80px; }
  #loginBrand .logoFallback { width: 80px; height: 80px; font-size: 26px; }
  .loginName { font-weight: 700; color: #fff; font-size: 17px; text-align: center; text-shadow: 0 2px 12px rgba(0,0,0,.3); }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 2px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { width: auto; margin: 0; white-space: nowrap; background: rgba(255,255,255,.1); color: #e2e8f0; border: 1px solid rgba(255,255,255,.22); box-shadow: none; text-shadow: none; }
  .tabs button.active { background: linear-gradient(135deg, rgba(251,191,36,.95), rgba(244,114,182,.9)); color: #1e1b4b; border-color: rgba(255,255,255,.4); box-shadow: 0 8px 22px -8px rgba(244,114,182,.8); text-shadow: none; }

  /* ---------- Glass inputs & buttons ---------- */
  input, select {
    width: 100%; padding: 12px 14px; margin: 6px 0;
    border: 1px solid rgba(255,255,255,.28); border-radius: 14px;
    font-size: 15px; background: rgba(255,255,255,.1); color: #fff;
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input::placeholder { color: rgba(226,232,240,.6); }
  input:focus, select:focus { outline: none; border-color: rgba(103,232,249,.9); background: rgba(255,255,255,.16); box-shadow: 0 0 0 4px rgba(34,211,238,.2); }
  input[type="date"], input[type="month"] { color-scheme: dark; }
  label.muted { display: block; margin-top: 12px; font-size: 12.5px; font-weight: 600; color: rgba(226,232,240,.85); }
  button {
    width: 100%; padding: 13px; margin: 8px 0;
    border: 1px solid rgba(255,255,255,.3); border-radius: 14px;
    background: linear-gradient(135deg, rgba(34,211,238,.85), rgba(129,140,248,.9));
    color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,.2);
    box-shadow: 0 10px 26px -10px rgba(34,211,238,.7), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .15s ease, box-shadow .2s ease, filter .2s;
  }
  button:hover { filter: brightness(1.08); box-shadow: 0 12px 30px -10px rgba(34,211,238,.85), inset 0 1px 0 rgba(255,255,255,.4); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: rgba(255,255,255,.12); color: #f8fafc; border: 1px solid rgba(255,255,255,.26); box-shadow: none; text-shadow: none; }
  button.small { width: auto; padding: 8px 13px; margin: 0; font-size: 13px; border-radius: 11px; box-shadow: none; }

  /* ---------- Rows & misc ---------- */
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.12); font-size: 14px; }
  .btns { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }
  .muted { color: rgba(226,232,240,.72); font-size: 13px; }
  .error { color: #fca5a5; font-size: 14px; min-height: 18px; }
  .okTxt { color: #86efac; font-weight: 700; }
  .badTxt { color: #fca5a5; font-weight: 700; }
  .warnTxt { color: #fcd34d; font-weight: 700; }
  .thumb { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); }
  .thumbFallback { display: inline-flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; background: linear-gradient(135deg, rgba(34,211,238,.6), rgba(129,140,248,.7)); }
  .prev { display: block; height: 70px; width: auto; background: rgba(255,255,255,.92); border: 1px solid rgba(255,255,255,.4); border-radius: 12px; padding: 4px; margin: 8px 0; }
  .bigPhoto { width: 90px; height: 90px; border-radius: 16px; object-fit: cover; display: block; margin-bottom: 10px; border: 1px solid rgba(255,255,255,.35); box-shadow: 0 8px 20px rgba(2,6,23,.35); }
  .hidden { display: none !important; }
  textarea { width: 100%; padding: 12px 14px; margin: 6px 0; border: 1px solid rgba(255,255,255,.28); border-radius: 14px; font-size: 15px; background: rgba(255,255,255,.1); color: #fff; font-family: inherit; resize: vertical; }
  textarea:focus { outline: none; border-color: rgba(103,232,249,.9); }
  .pre { white-space: pre-wrap; font-size: 14px; line-height: 1.6; background: rgba(255,255,255,.07); border-radius: 12px; padding: 10px 12px; margin: 6px 0; }

  /* ---------- Photo buttons ---------- */
  .photoBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
  .photoBtn { display: block; text-align: center; padding: 12px 8px; border-radius: 14px; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.26); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
  .photoCam { background: linear-gradient(135deg, rgba(34,211,238,.85), rgba(129,140,248,.9)); box-shadow: 0 10px 24px -10px rgba(34,211,238,.7); }

  /* ---------- Collection & dues ---------- */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 12px; }
  .stat { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 16px; padding: 12px 6px; text-align: center; }
  .stat span { display: block; font-size: 12px; color: rgba(226,232,240,.75); margin-bottom: 3px; }
  .stat b { font-size: 15px; }
  .queue { background: rgba(251,191,36,.14); border: 1px solid rgba(251,191,36,.4); border-radius: 16px; padding: 12px; margin: 10px 0; }
  .queue .row { border-bottom: 0; padding: 4px 0 8px; }
  .note { font-size: 12px; color: rgba(226,232,240,.7); line-height: 1.5; margin: 6px 0 4px; }

  /* ---------- SVG animations ---------- */
  .code { transform-box: fill-box; transform-origin: left center; animation: typeIn 4s ease-in-out infinite; }
  .cursor { animation: blink 1s steps(1) infinite; }
  .led { animation: led 1.6s steps(2) infinite; }
  .bar { transform-box: fill-box; transform-origin: center bottom; animation: grow 2.8s ease-in-out infinite; }
  .floatY { animation: floatY 4.5s ease-in-out infinite; }
  .floatY2 { animation: floatY 5.5s ease-in-out infinite reverse; }
  .bob { animation: bob 3s ease-in-out infinite; }
  .steam { fill: none; stroke: #cbd5e1; stroke-width: 2; stroke-linecap: round; stroke-dasharray: 4 8; animation: steam 2.8s linear infinite; }
  .litkey { animation: keySlide 3.2s ease-in-out infinite; }
  .glow { transform-box: fill-box; transform-origin: center; animation: glowPulse 5s ease-in-out infinite; }

  @keyframes gridMove { to { background-position: 40px 40px; } }
  @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(22px,-16px); } }
  @keyframes rise { from { transform: translateY(0) rotate(0deg); } to { transform: translateY(-115vh) rotate(18deg); } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes floatY { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @keyframes typeIn { 0%,100% { transform: scaleX(.15); opacity: .5; } 45%,75% { transform: scaleX(1); opacity: 1; } }
  @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
  @keyframes led { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes grow { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  @keyframes steam { from { stroke-dashoffset: 0; opacity: .9; } to { stroke-dashoffset: -28; opacity: 0; } }
  @keyframes keySlide { 0% { transform: translateX(0); } 50% { transform: translateX(124px); } 100% { transform: translateX(0); } }
  @keyframes glowPulse { 0%,100% { opacity: .75; } 50% { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>

// Image ko chhota karke data URL banata hai (Firestore doc ka size chhota rahe)
function resizeImage(file, maxW, mime) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      const ctx = c.getContext("2d");
      if (mime === "image/jpeg") { ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); }
      ctx.drawImage(img, 0, 0, c.width, c.height);
      resolve({ data: c.toDataURL(mime, 0.85), ratio: c.width / c.height });
    };
    img.onerror = () => reject(new Error("Image read nahi ho payi"));
    img.src = URL.createObjectURL(file);
  });
}

async function saveStudent(e, editing) {
  e.preventDefault();
  const batchId = $("sBatch").value;
  const batch = (await getDoc(doc(db, "batches", batchId))).data();
  const fields = {
    name: $("sName").value.trim(),
    father: $("sFather").value.trim(),
    mother: $("sMother").value.trim(),
    address: $("sAddress").value.trim(),
    phone: $("sPhone").value.trim(),
    batchId,
    batchName: batch.name,
    course: batch.course,
    feePlan: $("sPlan").value
  };

  if (editing) {
    await setDoc(doc(db, "students", editing.rollNo), fields, { merge: true });
    await savePhoto(editing.rollNo, editing.authUid);
    alert(t("studentUpdated"));
    openAdminTab("students");
    return;
  }

  const rollNo = $("sRoll").value.trim().toUpperCase();
  if (!/^[A-Z0-9]+$/.test(rollNo)) return alert(t("rollInvalid"));
  const studentRef = doc(db, "students", rollNo);
  if ((await getDoc(studentRef)).exists()) return alert(t("rollExists"));

  let cred;
  try {
    cred = await createUserWithEmailAndPassword(secondaryAuth, studentEmail(rollNo), dobToPassword($("sDob").value));
  } catch (err) {
    if (err.code === "auth/email-already-in-use") return alert(t("rollReused"));
    throw err;
  }
  await signOut(secondaryAuth);

  await setDoc(studentRef, {
    ...fields,
    rollNo,
    dob: $("sDob").value,
    authUid: cred.user.uid,
    createdAt: serverTimestamp()
  });

      ${batchStudents.length ? `<button id="saveMarks">${t("saveMarks")}</button>` : ""}
      <p id="marksMsg" class="muted">${t("clearHint")}</p>
    </div>`;

  $("exportMarks").onclick = () => exportMarksCSV(test, testId, batchStudents, existing);

async function saveMarks(test, testId) {
  const inputs = [...document.querySelectorAll(".mk")];
  const jobs = [];
  for (const inp of inputs) {
    const roll = inp.dataset.roll;
    const ref = doc(db, "marks", `${testId}_${roll}`);
    const raw = inp.value.trim();
    if (raw === "") {
      jobs.push(deleteDoc(ref));
      continue;
    }
    const m = Number(raw);
    if (!Number.isInteger(m) || m < 0 || m > test.maxMarks) {
      return alert(`${roll}: ${t("marksRange")} ${test.maxMarks}`);
    }
    jobs.push(setDoc(ref, {
      testId,
      rollNo: roll,
      authUid: inp.dataset.uid,
      batchId: test.batchId,
      marks: m,
      updatedAt: serverTimestamp()
    }));
  }
  await Promise.all(jobs);
  if (test.type === "annual" && test.passMarks != null) {
    await Promise.all(inputs.map((inp) => {
      const raw = inp.value.trim();
      return syncCertificate(test, testId, inp.dataset, raw === "" ? null : Number(raw));
    }));
  }
  $("marksMsg").textContent = t("marksSaved");
}

// ---------- Monthly collection, dues & WhatsApp reminders ----------
let selectedMonth = "";
let duesCache = [];
let remindQueue = [];
let remindIdx = 0;

function balanceOf(s, fees, payments) {
  const total = feeTotal(s, fees[s.course]);
  if (!total) return null;
  const paid = sumPaid(payments.filter((p) => p.rollNo === s.rollNo));
  return { total, paid, balance: total - paid };
}

// Indian 10-digit number ko 91 ke saath WhatsApp link banata hai
function waLink(phone, text) {
  let d = String(phone || "").replace(/\D/g, "");
  if (d.length === 10) d = "91" + d;
  if (!d) return "";
  return `https://wa.me/${d}?text=${encodeURIComponent(text)}`;
}

function reminderText(s, balance) {
  return t("msgFee")
    .replace("{name}", s.name)
    .replace("{roll}", s.rollNo)
    .replace("{course}", s.course)
    .replace("{amount}", money(balance))
    .replace("{institute}", settings.name || "Vedant Sri Computer Institute");
}

async function renderCollection() {
  const [students, fees, payments] = await Promise.all([loadStudents(), loadCourseFees(), loadPayments()]);
  if (!selectedMonth) selectedMonth = todayISO().slice(0, 7);

  // Monthly plan: chune hue mahine ki kisht kitni aayi
  const monthlyStudents = students.filter((s) =>
    s.feePlan === "monthly" && fees[s.course] && fees[s.course].monthlyFee > 0);
  let expected = 0, collected = 0;
  const monthRows = monthlyStudents.map((s) => {
    const due = fees[s.course].monthlyFee;
    const paidM = sumPaid(payments.filter((p) => p.rollNo === s.rollNo && payMonth(p) === selectedMonth));
    expected += due;
    collected += paidM;
    const st = paidM >= due ? "paid" : paidM > 0 ? "partial" : "pending";
    const cls = st === "paid" ? "okTxt" : st === "partial" ? "warnTxt" : "badTxt";
    return `
      <div class="row">
        <span><b>${esc(s.rollNo)}</b> - ${esc(s.name)}<br><span class="muted">${money(paidM)} / ${money(due)}</span></span>
        <span class="btns"><span class="${cls}">${t(st)}</span>${st === "paid" ? "" : `<button class="small" data-collect="${esc(s.rollNo)}">${t("collect")}</button>`}</span>
      </div>`;
  }).join("") || `<p class="muted">${t("noMonthly")}</p>`;

  // Sabka bakaya (dono plan)
  duesCache = students
    .map((s) => ({ s, b: balanceOf(s, fees, payments) }))
    .filter((x) => x.b && x.b.balance > 0)
    .sort((a, b) => b.b.balance - a.b.balance);
  const dueTotal = duesCache.reduce((sum, x) => sum + x.b.balance, 0);
  const dueRows = duesCache.map(({ s, b }) => `
    <div class="row">
      <span><b>${esc(s.rollNo)}</b> - ${esc(s.name)}<br><span class="muted">${esc(s.phone || t("noPhone"))} | ${esc(s.course)}</span></span>
      <span style="text-align:right">
        <b class="badTxt">${money(b.balance)}</b><br>
        <span class="btns" style="justify-content:flex-end;margin-top:4px">
          <button class="small secondary" data-remind-one="${esc(s.rollNo)}" ${waLink(s.phone, "x") ? "" : "disabled"}>${t("whatsapp")}</button>
          <button class="small secondary" data-collect="${esc(s.rollNo)}">${t("collect")}</button>
        </span>
      </span>
    </div>`).join("") || `<p class="muted">${t("noDues")}</p>`;

  return `
    <div class="card">
      <h3>${t("monthlyCollection")}</h3>
      <label class="muted">${t("monthLabel")}</label>
      <input id="monthPick" type="month" value="${selectedMonth}">
      <div class="stats">
        <div class="stat"><span>${t("expected")}</span><b>${money(expected)}</b></div>
        <div class="stat"><span>${t("collected")}</span><b class="okTxt">${money(collected)}</b></div>
        <div class="stat"><span>${t("pending")}</span><b class="badTxt">${money(expected - collected)}</b></div>
      </div>
      ${monthRows}
    </div>
    <div class="card">
      <h3>${t("dueList")}</h3>
      <p class="muted">${t("dueSummary").replace("{count}", duesCache.length).replace("{amount}", money(dueTotal))}</p>
      <button id="startRemind">${t("remindAll")}</button>
      <p class="note">${t("remindNote")}</p>
      <div id="queueBox"></div>
      ${dueRows}
    </div>`;
}

function bindCollection() {
  $("monthPick").onchange = () => {
    selectedMonth = $("monthPick").value || selectedMonth;
    openAdminTab("collection");
  };
  document.querySelectorAll("#adminContent [data-collect]").forEach((b) =>
    (b.onclick = safe(() => openPayments(b.dataset.collect, selectedMonth))));
  document.querySelectorAll("#adminContent [data-remind-one]").forEach((b) =>
    (b.onclick = () => remindOne(b.dataset.remindOne)));
  $("startRemind").onclick = startRemind;
  renderQueue();
}

// Ek student ko akela reminder
function remindOne(roll) {
  const x = duesCache.find((d) => d.s.rollNo === roll);
  if (!x) return;
  const url = waLink(x.s.phone, reminderText(x.s, x.b.balance));
  if (!url) return alert(t("noPhone"));
  window.open(url, "_blank");
}

// Sab bakaya walon ke liye queue: har tap par ek student ka WhatsApp khulega
function startRemind() {
  remindQueue = duesCache
    .filter((x) => waLink(x.s.phone, "x"))
    .map((x) => ({ rollNo: x.s.rollNo, name: x.s.name, course: x.s.course, phone: x.s.phone, balance: x.b.balance }));
  remindIdx = 0;
  if (!remindQueue.length) { alert(t("noPhoneList")); return; }
  renderQueue();
}

function renderQueue() {
  const box = $("queueBox");
  if (!box) return;
  if (!remindQueue.length) { box.innerHTML = ""; return; }
  if (remindIdx >= remindQueue.length) {
    box.innerHTML = `
      <div class="queue">
        <b class="okTxt">${t("remindDone")}</b>
        <div class="btns" style="margin-top:8px"><button id="remindClose" class="small secondary">${t("remindClose")}</button></div>
      </div>`;
  } else {
    const it = remindQueue[remindIdx];
    box.innerHTML = `
      <div class="queue">
        <div class="muted">${t("remindProgress").replace("{done}", remindIdx).replace("{total}", remindQueue.length)}</div>
        <div class="row"><span><b>${esc(it.name)}</b> (${esc(it.rollNo)})<br><span class="muted">${esc(it.phone)}</span></span><b class="badTxt">${money(it.balance)}</b></div>
        <button id="remindNext">${t("remindNext")}</button>
        <div class="btns" style="margin-top:4px"><button id="remindSkip" class="small secondary">${t("remindSkip")}</button><button id="remindClose" class="small secondary">${t("remindClose")}</button></div>
      </div>`;
    $("remindNext").onclick = () => {
      window.open(waLink(it.phone, reminderText(it, it.balance)), "_blank");
      remindIdx++;
      renderQueue();
    };
    $("remindSkip").onclick = () => { remindIdx++; renderQueue(); };
  }
  $("remindClose").onclick = () => { remindQueue = []; remindIdx = 0; renderQueue(); };
}

// ---------- Student portal ----------
async function renderStudent(s) {
  currentStudent = s;
  const [testsSnap, marksSnap, paySnap, feeSnap, photoSnap] = await Promise.all([
    getDocs(collection(db, "tests")),
    getDocs(query(collection(db, "marks"), where("authUid", "==", s.authUid))),
    getDocs(query(collection(db, "payments"), where("authUid", "==", s.authUid))),
    getDoc(doc(db, "courseFees", s.course)),
    getDocs(query(collection(db, "photos"), where("authUid", "==", s.authUid)))
  ]);

  const tests = testsSnap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .filter((x) => x.batchId === s.batchId)
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const marks = Object.fromEntries(marksSnap.docs.map((d) => [d.data().testId, d.data().marks]));
  studentCache = { tests: Object.fromEntries(tests.map((x) => [x.id, x])), marks };

  const weekly = tests.filter((x) => x.type !== "annual");
  const annual = tests.filter((x) => x.type === "annual");
  const scored = weekly.filter((x) => marks[x.id] !== undefined);
  const avg = scored.length
    ? (scored.reduce((sum, x) => sum + marks[x.id], 0) / scored.length).toFixed(1)
    : null;

  const resultRow = (x) => {
    const m = marks[x.id];
    let status = `<span class="muted">${t("notYet")}</span>`;
    let action = "";
    if (m !== undefined) {
      status = `<b>${m} / ${x.maxMarks}</b>`;
      if (x.type === "annual" && x.passMarks != null) {
        const passed = m >= x.passMarks;
        status += ` <span class="${passed ? "okTxt" : "badTxt"}">${t(passed ? "pass" : "fail")}</span>`;
        if (passed) {
          action = `<div style="margin-top:6px"><button class="small" data-cert="${esc(x.id)}">${t("downloadCert")}</button></div>`;
        }
      }
    }
    return `<div class="row">
      <span>${esc(x.title)}<br><span class="muted">${fmtDate(x.date)}</span></span>
      <span style="text-align:right">${status}${action}</span>
    </div>`;
  };

  const cfee = feeSnap.exists() ? feeSnap.data() : null;
  const total = feeTotal(s, cfee);
  const pays = paySnap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const paid = sumPaid(pays);
  const thisM = todayISO().slice(0, 7);
  const paidThisMonth = sumPaid(pays.filter((p) => payMonth(p) === thisM));
  const monthStatus = !cfee || !cfee.monthlyFee ? ""
    : paidThisMonth >= cfee.monthlyFee ? t("paid")
    : paidThisMonth > 0 ? t("partial") : t("pending");
  const feeHtml = total
    ? `
      <div class="row"><span class="muted">${t("feePlan")}</span><b>${t(s.feePlan === "monthly" ? "monthly" : "oneTime")}</b></div>
      <div class="row"><span class="muted">${t("totalDue")}</span><b>${money(total)}</b></div>
      <div class="row"><span class="muted">${t("paid")}</span><b>${money(paid)}</b></div>
      <div class="row"><span class="muted">${t("balance")}</span><b>${money(total - paid)}</b></div>
      ${s.feePlan === "monthly" && cfee && cfee.monthlyFee ? `<div class="row"><span class="muted">${t("thisMonth")}</span><b>${monthStatus}</b></div>` : ""}
      ${s.feePlan === "monthly" && cfee && cfee.monthlyFee
        ? `<div class="row"><span class="muted">${t("installments")}</span><b>${Math.floor(paid / cfee.monthlyFee)} ${t("ofWord")} ${cfee.months || 0}</b></div>`
        : ""}
      <h3 style="margin:14px 0 6px;font-size:14px">${t("paymentHistory")}</h3>
      ${pays.map((p) => `<div class="row"><span>${fmtDate(p.date)} | ${t(p.mode)}</span><span class="btns"><b>${money(p.amount)}</b><button class="small secondary" data-receipt="${esc(p.id)}">${t("receipt")}</button></span></div>`).join("")
        || `<p class="muted">${t("noPayments")}</p>`}`
    : `<p class="muted">${t("feeNotSetStudent")}</p>`;

  const details = [
    [t("rollNo"), s.rollNo], [t("course"), s.course], [t("batch"), s.batchName],
    [t("father"), s.father], [t("mother"), s.mother], [t("dob"), fmtDate(s.dob)],
    [t("phone"), s.phone], [t("address"), s.address]
  ].map(([k, v]) => `<div class="row"><span class="muted">${k}</span><b>${esc(v)}</b></div>`).join("");

  $("studentView").innerHTML = `
    <div class="card">${photoSnap.empty ? "" : `<img class="bigPhoto" src="${photoSnap.docs[0].data().photo}" alt="">`}<h3>${esc(s.name)}</h3>${details}<button id="idCardBtn" class="secondary">${t("idCard")}</button></div>
    <div class="card"><h3>${t("feeStatus")}</h3>${feeHtml}</div>
    <div class="card">
      <h3>${t("weeklyResults")}</h3>
      ${weekly.map(resultRow).join("") || `<p class="muted">${t("noResults")}</p>`}
      ${avg !== null ? `<div class="row"><span class="muted">${t("average")}</span><b>${avg} / ${MAX_WEEKLY}</b></div>` : ""}
    </div>
    <div class="card">
      <h3>${t("annualResults")}</h3>
      ${annual.map(resultRow).join("") || `<p class="muted">${t("noResults")}</p>`}
    </div>`;

  await renderStudentExtras(s);
  $("idCardBtn").onclick = safe(() => makeIdCard(s, photoSnap.empty ? null : photoSnap.docs[0].data().photo));
  document.querySelectorAll("#studentView [data-receipt]").forEach((b) =>
    (b.onclick = safe(() => downloadReceipt(pays.find((p) => p.id === b.dataset.receipt), s, total, paid))));
  document.querySelectorAll("#studentView [data-cert]").forEach((b) =>
    (b.onclick = safe(() => downloadCertificate(b.dataset.cert))));
}

// Certificate PDF browser mein banta hai (English naam hona chahiye)
async function downloadCertificate(testId) {
  const s = currentStudent;
  const test = studentCache.tests[testId];
  const m = studentCache.marks[testId];
  if (!test || m === undefined) return alert(t("noResults"));

  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
  const W = 297, H = 210, navy = [30, 58, 138];
  const center = { align: "center" };

  pdf.setDrawColor(...navy);
  pdf.setLineWidth(1.5);
  pdf.rect(8, 8, W - 16, H - 16);
  pdf.setLineWidth(0.4);
  pdf.rect(11, 11, W - 22, H - 22);

  if (settings.logoData) {
    const lw = Math.min(60, 24 * (settings.logoRatio || 1));
    pdf.addImage(settings.logoData, imgFmt(settings.logoData), W / 2 - lw / 2, 14, lw, 24);
  }

  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(22);
  pdf.setTextColor(...navy);
  pdf.text(settings.name || "Vedant Sri Computer Institute", W / 2, 50, center);
  if (settings.address) {
    pdf.setFont("helvetica", "normal");
    pdf.setFontSize(11);
    pdf.setTextColor(60, 60, 60);
    pdf.text(settings.address, W / 2, 57, center);
  }

  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(26);
  pdf.setTextColor(...navy);
  pdf.text("CERTIFICATE", W / 2, 76, center);

  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(13);
  pdf.setTextColor(0, 0, 0);
  pdf.text("This is to certify that", W / 2, 90, center);

  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(22);
  pdf.text(s.name, W / 2, 104, center);

  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(12);
  pdf.text(`Father's name: ${s.father || "-"}   |   Roll No: ${s.rollNo}   |   Course: ${s.course}`, W / 2, 115, center);
  pdf.text(`has successfully passed the ${test.title} held on ${fmtDate(test.date)}`, W / 2, 127, center);
  pdf.text(`with ${m} out of ${test.maxMarks} marks.`, W / 2, 135, center);

  const certNo = certNoOf(test, testId, s.rollNo);
  let qr = null;
  try { qr = await QRCode.toDataURL(verifyUrl(certNo), { margin: 1, width: 240 }); } catch (e) { qr = null; }
  pdf.setFontSize(10);
  pdf.setTextColor(80, 80, 80);
  pdf.text(`Certificate No: ${certNo}`, 22, H - 24);
  pdf.text(`Exam date: ${fmtDate(test.date)}`, 22, H - 18);
  if (qr) {
    pdf.addImage(qr, "PNG", 22, H - 64, 26, 26);
    pdf.setFontSize(7);
    pdf.text("Scan to verify", 22, H - 36);
  }

  if (settings.signatureData) {
    const sw = Math.min(50, 18 * (settings.signRatio || 2));
    pdf.addImage(settings.signatureData, imgFmt(settings.signatureData), W - 22 - sw, H - 50, sw, 18);
  }
  pdf.setDrawColor(0, 0, 0);
  pdf.line(W - 80, H - 30, W - 22, H - 30);
  pdf.setTextColor(0, 0, 0);
  pdf.setFontSize(11);
  pdf.text(settings.directorName || "Director", W - 51, H - 24, center);
  pdf.text("Director", W - 51, H - 18, center);

  pdf.save(`Certificate_${s.rollNo}.pdf`);
}

const certNoOf = (test, testId, roll) =>
  `VSC-${(test.date || "").slice(0, 4)}-${roll}-${testId.slice(-4).toUpperCase()}`;
const verifyUrl = (code) =>
  `${location.origin}${location.pathname}?verify=${encodeURIComponent(code)}`;

// Verification ke liye certificate ka public record (sirf naam, course, exam aur marks)
async function syncCertificate(test, testId, ds, m) {
  const code = certNoOf(test, testId, ds.roll);
  const ref = doc(db, "certificates", code);
  if (m === null || !(m >= test.passMarks)) return deleteDoc(ref);
  return setDoc(ref, {
    certNo: code, name: ds.name, course: ds.course,
    examTitle: test.title, examDate: test.date,
    marks: m, maxMarks: test.maxMarks, passed: true
  });
}

// ---------- CSV export (Excel mein seedha khulta hai) ----------
function downloadCSV(name, rows) {
  const cell = (v) => {
    const str = String(v ?? "");
    return /[",\r\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
  };
  const text = String.fromCharCode(0xFEFF) + rows.map((r) => r.map(cell).join(",")).join("\r\n");
  const url = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function exportStudentsCSV() {

  ]));

async function exportFeesCSV() {

  const rows = [["Roll No", "Name", "Course", "Plan", "Total fee", "Paid", "Balance", "Phone"]];

async function exportPaymentsCSV() {
  const [students, payments] = await Promise.all([loadStudents(), loadPayments()]);
  const nm = Object.fromEntries(students.map((s) => [s.rollNo, s.name]));
  const rows = [["Date", "Roll No", "Name", "Amount", "Mode", "For month", "Note"]];
  payments
    .sort((a, b) => (a.date || "").localeCompare(b.date || ""))

async function exportAttendanceCSV() {
  const [students, snap] = await Promise.all([loadStudents(), getDocs(collection(db, "attendance"))]);
  const nm = Object.fromEntries(students.map((s) => [s.rollNo, s.name]));

    .map((d) => d.data())
    .sort((a, b) => (a.date || "").localeCompare(b.date || ""))

function exportMarksCSV(test, testId, students, existing) {
  const rows = [["Roll No", "Name", "Marks", "Max marks", "Result"]];
  students.forEach((s) => {
    const m = existing[s.rollNo];
    const res = m === undefined || test.passMarks == null ? "" : (m >= test.passMarks ? "Pass" : "Fail");
    rows.push([s.rollNo, s.name, m ?? "", test.maxMarks, res]);
  });
  downloadCSV(`marks_${(test.title || "test").replace(/[^a-z0-9]+/gi, "_")}.csv`, rows);
}

async function refreshAttList() {
  const batchId = $("attBatch").value;
  const date = $("attDate").value || todayISO();
  const [students, att] = await Promise.all([loadStudents(), loadAttendance(batchId)]);
  const mine = students.filter((s) => s.batchId === batchId);
  const cur = Object.fromEntries(att.filter((a) => a.date === date).map((a) => [a.rollNo, a.status]));
  const opt = (v, label, sel) => `<option value="${v}" ${sel === v ? "selected" : ""}>${label}</option>`;
  $("attList").innerHTML = mine.length
    ? mine.map((s) => {
        const sel = cur[s.rollNo] || "";
        return `
        <div class="row">
          <span><b>${esc(s.rollNo)}</b> - ${esc(s.name)}</span>
          <select class="attSel" data-roll="${esc(s.rollNo)}" style="width:auto;margin:0;padding:8px 10px">
            ${opt("", t("attNotMarked"), sel)}
            ${opt("P", t("attPresent"), sel)}
            ${opt("A", t("attAbsent"), sel)}
            ${opt("L", t("attLeave"), sel)}
          </select>
        </div>`;
      }).join("") + `<button id="attSave">${t("attSave")}</button>`
    : `<p class="muted">${t("noStudentsInBatch")}</p>`;
  if ($("attSave")) $("attSave").onclick = safe(saveAttendance);
}

async function saveAttendance() {
  const batchId = $("attBatch").value;
  const date = $("attDate").value;
  if (!date) return alert(t("pickDate"));
  const students = (await loadStudents()).filter((s) => s.batchId === batchId);
  const jobs = students.map((s) => {
    const sel = document.querySelector(`.attSel[data-roll="${s.rollNo}"]`);
    const ref = doc(db, "attendance", `${date}_${s.rollNo}`);
    const st = sel ? sel.value : "";
    if (!st) return deleteDoc(ref);
    return setDoc(ref, {
      date, rollNo: s.rollNo, batchId, authUid: s.authUid, status: st, updatedAt: serverTimestamp()
    });
  });
  await Promise.all(jobs);
  alert(t("attSaved"));
  refreshAttList();
}

async function refreshAttReport() {
  const batchId = $("attBatch").value;
  const month = $("attMonth").value || todayISO().slice(0, 7);
  const [students, att] = await Promise.all([loadStudents(), loadAttendance(batchId)]);
  const rows = students.filter((s) => s.batchId === batchId).map((s) => {
    const recs = att.filter((a) => a.rollNo === s.rollNo && (a.date || "").startsWith(month));
    const p = recs.filter((a) => a.status === "P").length;
    const ab = recs.filter((a) => a.status === "A").length;
    const l = recs.filter((a) => a.status === "L").length;
    const pct = p + ab ? Math.round((p / (p + ab)) * 100) : null;
    const cls = pct === null ? "muted" : pct >= 75 ? "okTxt" : "badTxt";
    return `<div class="row">
      <span><b>${esc(s.rollNo)}</b> - ${esc(s.name)}<br>
      <span class="muted">${t("attPresent")}: ${p} · ${t("attAbsent")}: ${ab} · ${t("attLeave")}: ${l}</span></span>
      <b class="${cls}">${pct === null ? "-" : pct + "%"}</b></div>`;
  }).join("");
  $("attReport").innerHTML = rows || `<p class="muted">${t("noStudentsInBatch")}</p>`;
}

function bindAttendance() {
  if (!$("attBatch")) return;
  $("attBatch").onchange = safe(refreshAttList);
  $("attDate").onchange = safe(refreshAttList);
  $("attMonth").onchange = safe(refreshAttReport);
  refreshAttList();
  refreshAttReport();
}

// ---------- Fee receipt (PDF) ----------
function downloadReceipt(p, s, total, paid) {
  if (!p) return;
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: "mm", format: "a5", orientation: "landscape" });
  const W = 210, navy = [30, 58, 138];
  const rs = (n) => "Rs. " + Number(n || 0).toLocaleString("en-IN");
  const no = `RCPT-${(p.date || "").slice(0, 4)}-${p.id.slice(-6).toUpperCase()}`;

  pdf.setFillColor(...navy);
  pdf.rect(0, 0, W, 24, "F");
  pdf.setTextColor(255, 255, 255);
  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(15);
  pdf.text(settings.name || "Vedant Sri Computer Institute", 12, 12);
  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(9);
  if (settings.address) pdf.text(settings.address, 12, 18);

  pdf.setTextColor(15, 23, 42);
  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(13);
  pdf.text("PAYMENT RECEIPT", 12, 33);
  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(10);

  const lines = [
    ["Receipt No", no], ["Date", fmtDate(p.date)], ["Student", s.name], ["Roll No", s.rollNo],
    ["Course", s.course], ["Payment mode", p.mode || ""], ["Fee for month", p.forMonth || "-"],
    ["Amount paid", rs(p.amount)], ["Total fee", rs(total)], ["Total paid to date", rs(paid)],
    ["Balance now", rs(total - paid)]
  ];
  let y = 42;
  lines.forEach(([k, v]) => {
    pdf.setTextColor(100, 116, 139);
    pdf.text(k, 12, y);
    pdf.setTextColor(15, 23, 42);
    pdf.setFont("helvetica", "bold");
    pdf.text(String(v), 72, y);
    pdf.setFont("helvetica", "normal");
    y += 7;
  });
  if (p.note) {
    pdf.setTextColor(100, 116, 139);
    pdf.text("Note: " + p.note, 12, y + 2);
  }
  pdf.setDrawColor(203, 213, 225);
  pdf.line(132, 128, 198, 128);
  pdf.setTextColor(15, 23, 42);
  pdf.text("Authorised signatory", 165, 133, { align: "center" });
  pdf.save(`Receipt_${no}.pdf`);
}

    pdf.addImage(photo, imgFmt(photo), 4, 16, 20, 24);
  } else {
    pdf.setFillColor(226, 232, 240);
    pdf.rect(4, 16, 20, 24, "F");
    pdf.setTextColor(30, 58, 138);
    pdf.setFontSize(14);
    pdf.text(String(s.name || "?")[0].toUpperCase(), 11, 31);
  }

  pdf.setTextColor(15, 23, 42);
  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(10);
  pdf.text(String(s.name || "").slice(0, 26), 28, 22);
  pdf.setFont("helvetica", "normal");
  pdf.setFontSize(7.5);
  const rows = [["Roll No", s.rollNo], ["Course", s.course], ["Batch", s.batchName || ""], ["DOB", fmtDate(s.dob)], ["Phone", s.phone || ""]];
  let y = 27;
  rows.forEach(([k, v]) => {
    pdf.setTextColor(100, 116, 139);
    pdf.text(k, 28, y);
    pdf.setTextColor(15, 23, 42);
    pdf.text(String(v), 45, y);
    y += 4.5;
  });
  pdf.save(`ID_${s.rollNo}.pdf`);
}

// ---------- Enquiries (admission follow-up) ----------
async function renderEnquiries() {
  const snap = await getDocs(collection(db, "enquiries"));
  const list = snap.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.date || "").localeCompare(a.date || ""));
  const stOpts = (cur) => ["new", "contacted", "joined", "closed"]
    .map((k) => `<option value="${k}" ${cur === k ? "selected" : ""}>${t("enq_" + k)}</option>`).join("");
  const rows = list.map((e) => `
    <div class="row">
      <span><b>${esc(e.name)}</b> <span class="muted">${esc(e.phone || "")} | ${esc(e.course || "")} | ${fmtDate(e.date)}</span>
      ${e.note ? `<br><span class="muted">${esc(e.note)}</span>` : ""}</span>
      <span class="btns">
        <select class="enqSel" data-id="${esc(e.id)}" style="width:auto;margin:0;padding:6px 8px">${stOpts(e.status || "new")}</select>
        ${currentStaffRole === "admin" ? `<button class="small secondary" data-enq-del="${esc(e.id)}">${t("delete")}</button>` : ""}
      </span>
    </div>`).join("") || `<p class="muted">${t("noEnquiries")}</p>`;
  return `
    <div class="card">
      <h3>${t("enqTitle")}</h3>
      <form id="enqForm">
        <input id="eName" placeholder="${t("name")}" required>
        <input id="ePhone" placeholder="${t("phone")}" inputmode="tel">
        <input id="eCourse" placeholder="${t("course")}">
        <input id="eNote" placeholder="${t("note")}">
        <button type="submit">${t("enqSave")}</button>
      </form>
    </div>
    <div class="card"><h3>${t("enqList")} (${list.length})</h3>${rows}</div>`;
}

function bindEnquiries() {
  $("enqForm").onsubmit = safe(async (e) => {
    e.preventDefault();
    await addDoc(collection(db, "enquiries"), {
      name: $("eName").value.trim(), phone: $("ePhone").value.trim(),

    });
    openAdminTab("enquiries");
  });

    (b.onclick = safe(async () => {

      await deleteDoc(doc(db, "enquiries", b.dataset.enqDel));
      openAdminTab("enquiries");
    })));
}

// ---------- Batch details: timetable + study material ----------
async function openBatchInfo(id) {
  currentTab = "batches";
  const box = $("adminContent");
  const b = (await getDoc(doc(db, "batches", id))).data();
  const mats = b.materials || [];
  box.innerHTML = `
    <div class="card">
      <button id="backBatch" class="small secondary">${t("back")}</button>
      <h3 style="margin-top:12px">${esc(b.name)} <span class="muted">(${esc(b.course)})</span></h3>
      <label class="muted">${t("timetable")}</label>
      <textarea id="bTimetable" rows="6">${esc(b.timetable || "")}</textarea>
      <button id="saveTimetable">${t("saveTimetable")}</button>
      <h3 style="margin-top:16px">${t("materials")}</h3>
      ${mats.map((m, i) => `
        <div class="row">
          <span><b>${esc(m.title)}</b><br><span class="muted">${esc(m.url)}</span></span>
          <button class="small secondary" data-mat-del="${i}">${t("delete")}</button>
        </div>`).join("") || `<p class="muted">${t("noMaterials")}</p>`}
      <label class="muted">${t("materialTitle")}</label>
      <input id="mTitle">
      <label class="muted">Link (URL)</label>
      <input id="mUrl" placeholder="https://">
      <button id="addMat">${t("addMaterial")}</button>
    </div>`;
  $("backBatch").onclick = () => openAdminTab("batches");
  $("saveTimetable").onclick = safe(async () => {
    await setDoc(doc(db, "batches", id), { timetable: $("bTimetable").value }, { merge: true });
    alert(t("timetableSaved"));
  });
  $("addMat").onclick = safe(async () => {
    const url = $("mUrl").value.trim();
    if (!/^https?:\/\//.test(url)) return alert(t("badUrl"));
    const title = $("mTitle").value.trim() || url;
    await setDoc(doc(db, "batches", id), { materials: [...mats, { title, url }] }, { merge: true });
    openBatchInfo(id);
  });
  box.querySelectorAll("[data-mat-del]").forEach((btn) =>
    (btn.onclick = safe(async () => {
      const i = Number(btn.dataset.matDel);
      await setDoc(doc(db, "batches", id), { materials: mats.filter((_, j) => j !== i) }, { merge: true });
      openBatchInfo(id);
    })));
}

// ---------- Student portal: attendance, notices, timetable, material ----------
async function renderStudentExtras(s) {
  const [attSnap, batchSnap, noticeSnap] = await Promise.all([
    getDocs(query(collection(db, "attendance"), where("authUid", "==", s.authUid))),
    getDoc(doc(db, "batches", s.batchId)),
    getDocs(collection(db, "notices"))
  ]);
  const recs = attSnap.docs.map((d) => d.data());
  const cnt = (list, st) => list.filter((a) => a.status === st).length;
  const pct = (list) => {
    const p = cnt(list, "P"), a = cnt(list, "A");
    return p + a ? Math.round((p / (p + a)) * 100) + "%" : "-";
  };
  const thisM = todayISO().slice(0, 7);
  const batch = batchSnap.exists() ? batchSnap.data() : {};
  const mats = (batch.materials || []).filter((m) => /^https?:\/\//.test(m.url || ""));
  const notices = noticeSnap.docs
    .map((d) => ({ id: d.id, ...d.data() }))
    .filter((n) => n.audience === "all" || n.audience === s.batchId)
    .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
    .slice(0, 20);

  const attHtml = `
    <div class="card">
      <h3>${t("attendance")}</h3>
      <div class="row"><span class="muted">${t("attOverall")}</span><b>${pct(recs)}</b></div>
      <div class="row"><span class="muted">${t("attThisMonth")}</span><b>${pct(recs.filter((a) => (a.date || "").startsWith(thisM)))}</b></div>
      <div class="row"><span class="muted">${t("attPresent")}</span><b>${cnt(recs, "P")}</b></div>
      <div class="row"><span class="muted">${t("attAbsent")}</span><b>${cnt(recs, "A")}</b></div>
      <div class="row"><span class="muted">${t("attLeave")}</span><b>${cnt(recs, "L")}</b></div>
    </div>`;
  const noticeHtml = `
    <div class="card">
      <h3>${t("navNotices")}</h3>
      ${notices.map((n) => `
        <div class="row" style="display:block">
          <b>${esc(n.title)}</b> <span class="muted">${fmtDate(n.date)}</span>
          <div class="pre">${esc(n.body)}</div>
        </div>`).join("") || `<p class="muted">${t("noNotices")}</p>`}
    </div>`;
  const batchHtml = `
    <div class="card">
      <h3>${t("timetable")}</h3>
      <div class="pre">${esc(batch.timetable || "-")}</div>
      <h3 style="margin-top:14px">${t("materials")}</h3>
      ${mats.map((m) => `
        <div class="row"><span>${esc(m.title)}</span>
        <a href="${esc(m.url)}" target="_blank" rel="noopener" style="color:#67e8f9;font-weight:700">${t("open")}</a></div>`).join("")
        || `<p class="muted">${t("noMaterials")}</p>`}
    </div>`;
  $("studentView").insertAdjacentHTML("beforeend", attHtml + noticeHtml + batchHtml);
}

// ---------- Certificate verification (QR se khulta hai) ----------
async function showVerify(code) {
  ["loginView", "adminView", "studentView"].forEach((v) => $(v).classList.add("hidden"));
  $("logoutBtn").classList.add("hidden");
  $("verifyView").classList.remove("hidden");
  const snap = await getDoc(doc(db, "certificates", code));
  const c = snap.exists() ? snap.data() : null;
  $("verifyCard").innerHTML = `
    <h3>${t("verifyTitle")}</h3>
    <form id="verifyForm">
      <input id="vCode" value="${esc(code)}" placeholder="${t("certNo")}">
      <button type="submit">${t("verifyCheck")}</button>
    </form>
    ${c && c.passed ? `
      <div class="row"><span class="muted">${t("certNo")}</span><b>${esc(c.certNo)}</b></div>
      <div class="row"><span class="muted">${t("name")}</span><b>${esc(c.name)}</b></div>
      <div class="row"><span class="muted">${t("course")}</span><b>${esc(c.course)}</b></div>
      <div class="row"><span class="muted">${t("examLabel")}</span><b>${esc(c.examTitle)}</b></div>
      <div class="row"><span class="muted">${t("date")}</span><b>${fmtDate(c.examDate)}</b></div>
      <div class="row"><span class="muted">${t("marksLabel")}</span><b>${c.marks} / ${c.maxMarks}</b></div>
      <p class="okTxt">${t("verifyOk")}</p>`
      : `<p class="badTxt">${t("verifyNo")}</p>`}
    <button id="verifyBack" class="secondary">${t("verifyBack")}</button>`;
  $("verifyForm").onsubmit = (e) => { e.preventDefault(); showVerify($("vCode").value.trim()); };
  $("verifyBack").onclick = () => { location.href = location.pathname; };
}
